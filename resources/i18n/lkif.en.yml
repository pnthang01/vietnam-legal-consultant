en:
  comment:
    #lkif-top.owl
    AbstractEntity: "An abstract concept is a concept which does not (necessarily) have a referent in either the physical or the mental world. Abstract entities are (proto)mathematical, formal entities, entities which have a purely formal, logical or mathematical meaning. As all concepts are abstractions, one may argue that a separate abstract world is difficult to see. In common-sense, a circle has more properties and is less abstract than in mathematics. Even mathematicians marvel about the fact their pure abstractions enable us to predict very concrete things. However, we are not directly concerned with these mappings. The most important is that common-sense knows about a (small) number of proto-mathematical concepts, such as collections, sequences and count-numbers (positive integers). We know also about geometric simplifications such as line, circle, square, cube, etc. These common sense notions might even be the real roots of our mathematics. However, these kind of semi-formal abstractions do not play a very central role in law, and therefore LRI-Core is thinly populated with abstract classes."
    MentalEntity: "We made the assumption that our views of the mental world have been developed in analogy with physical processes. Mental objects like thoughts are made of elementary parts: concepts. The contents (substance) of these objects are representations. The conceptual content of thoughts are intended by propositional attitudes, like belief, desire, norm etc. Mental objects are processed or stored in containers like a mind which has parts like various memories. Mental processes like thinking, memorizing, imaging, etc. are operations on mental objects. The energy equivalent of mental processing are emotions: the forces that make us focus our mental energies. There is an important difference between the mental world and the physical. Where physical processes occur causally, mental processes are controlled by an intentional stance. The outcome of mental processes can be the intention to act. The intention to act may consist of a structure of primary actions: a plan. The actions can be aimed at bringing about physical changes, but they may also be aimed at changing the mental state of another agent: these intended actions are communication actions. Like direct actions, communication actions have a physical appearance. They also need some physical medium to transfer the intended mental state. Speech act is the common term for these actions. Whether this notion of intended control over mental processes and actions is an illusion or not is besides the point in modeling common-sense. The intentional stance implies a kind of backward, teleological reasoning over causally related processes. A mental object like a  plan consists of a goal state (intention) and is produced by reasoning from goal to means (actions): this is what rational agency behavior is about.  The mental world is not only a reflective one based in our minds eye. We may observe the stream of conscious mental processes, but the role of the mental conceptualizations is of even more important in understanding and communicating with other people. Mental processes and attitudes (sources of intention) are in the first place the building stones for modeling the minds of other people. The intentional stance means in the first place that we attribute to others and to some extent also to many animals intentions and intention directed mental processing and belief."
    MentalObject: "Metaphor of physical concepts, i.e. the things we mentally manipulate, either in thought or memory"
    Occurrence: "The physical world evolves around two main classes: physical objects and processes. In lkif-core, the physical world evolves around two main classes: physical objects and processes. Objects are pieces of matter, while matter is typed by substances. Objects have mass, extension, viz. form and aggregation state (which limits form). Objects are the specification of the notion that matter, and in particular solid objects, is what makes the physical world relatively stable and observable. We define (physical) situations in the first place by the arrangement of physical objects (entities)."
    PhysicalEntity: "The physical world evolves around two main classes: physical objects and processes. In lkif-core, the physical world evolves around two main classes: physical objects and processes. Objects are pieces of matter, while matter is typed by substances. Objects have mass, extension, viz. form and aggregation state (which limits form). Objects are the specification of the notion that matter, and in particular solid objects, is what makes the physical world relatively stable and observable. We define (physical) situations in the first place by the arrangement of physical objects (entities)."
    SpatioTemporalOccurrence: "An occurrence in space-time."
    #mereology.owl
    Atom: "An atom has no parts"
    Composition: "A composition has multiple parts, the components should meet"
    Pair: "A composition of exactly two parts"
    Part: "A part is a part_of some whole"
    Whole: "A whole has at least some part"
    component: "Specifies that some thing is a (functional) component of some other thing"
    component_of: "Specifies that some thing is a (functional) component of some other thing"
    composes: "Specifies that some thing is composed_of (spatially) within some other thing"
    composed_of: "Specifies that some thing is composed_of (spatially) within some other thing"
    contains: "Specifies that some thing is contained (spatially) within some other thing"
    contained_in: "Specifies that some thing is contained (spatially) within some other thing"
    direct_part_of: "The non-transitive part_of relation"
    direct_part: "The non-transitive part relation"
    member_of: "Specifies membership of a set or group"
    member: "Specifies membership of a set or group"
    part: "Transitive part relation"
    part_of: "Transitive part_of relation"
    strict_part_of: "Non transitive part_of relation"
    strict_part: "Non transitive part relation"
    #time.owl
    Interval: "An interval is a composition of multiple periods of time."
    Moment: "A moment is an atomic period of time, i.e. it cannot be divided into other parts"
    PairOfPeriods: "A pair of two time periods"
    TemporalOccurrence: "A period of time, has a duration"
    after: "Specifies that a time period occurs after another period, but might overlap with it."
    before: "Specifies that a time period occurs before another period, but might overlap with it."
    between: "Specifies that a time period occurs between two other periods"
    during: "Specifies that a time period occurs during another period"
    finishes: "Specifies that a time period finishes another period, i.e. the other period starts before, but ends at the same moment"
    immediately_after: "Specifies that a time period occurs immediately after another period, i.e. it starts where the other period ends"
    immediately_before: "Specifies that a time period occurs immediately before another period, i.e. it ends where the other period starts. t1 previous t2: interval t1 is before t2, but there is no interval between them, i.e., t1 ends where t2 starts"
    overlap: "Specifies that a time period overlaps with another time period (in any way)"
    preceeds: "Specifies that a time period preceeds another period, the periods do not overlap"
    starts: "Specifies that a time period starts another period, i.e. the other period starts at the same time, but ends at a later time."
    temporal_relation: "A relation between two time periods"
    #process.owl
    Change: "A change is a difference between the situation before and after the change occurs (the event of the change). A change can be instantaneous"
    Continuation: "The continuation of a change, once initiated"
    Initiation: "The initation of a change"
    MentalProcess: "A mental, i.e. non-physical, process that has no physical effects. Examples are (human) thought and reasoning."
    PhysicalObject: "A physical object is a physical entity consisting of matter, it has a spatio-temporal extension."
    Process: "A process is a &#39;causal&#39; change: any change which can be explained through some known or understood causal structure. Every process has some Time_Period as duration."
    Termination: "The termination of a change."
    created_by: "Specifies that some thing is created (i.e. a result of) by a process, and exists because of the process taking place."
    creation: "Specifies that some thing is created (i.e. a result of) by a process, and exists because of the process taking place."
    participant: "A participant is someone or something that participates in a change, i.e. is involved in a change"
    participant_in: "Specifies that some thing participates in a process"
    requirement: "A requirement relation relates the process with a prerequisite for that process: without it the process cannot occur"
    requirement_of: "Specifies that some participant is a requirement for a process"
    resource: "A resource is some quantity of something used to perform the action: i.e. time, energy"
    resource_for: "Specifies that some participant is a resource for a process"
    result: "Specifies that some participant is the result of the process, it might have existed before the process took place, but is in some way altered"
    result_of: "Specifies that some participant is the result of a process, it might have existed before the process took place, but is in some way altered (an &#39;inanimate&#39; goal of an act)"
    #action.owl
    Action: "An action is a change which is brought about by a single agent, playing a role. The agent is the holder of some indended outcome of the action: an action is always intentional. The intention of the agent has usually corresponds with an expectation the intended outcome to be brought about: the agent believes in some expectation. Note that the intention might not correspond with the *actual* outcome of the action."
    Agent: "An agent is any owl:Thing which can act, i.e. play the &#39;actor&#39; role wrt. an action. It is a holder for propositional attitudes"
    Artifact: "A physical object created by some person to fulfill a particular purpose"
    CollaborativePlan: "A collaborative plan is a plan which is shared (and executed) between at least two agents a and b. "
    Creation: "An act which results in the creation of some entity/individual"
    NaturalObject: "A natural object is an object not created by man."
    Organisation: "An organisation is a group of other organisations or persons which acts &#39;as one&#39;. An organisation can be both formal (i.e. created by law or decree) or informal."
    Person: "A person is an individual agent. Usually associated with &#39;human being&#39;."
    PersonalPlan: "A personal plan is a plan which is held (and can be executed) by at most one agent."
    Plan: "A plan is a structure of multiple other plans or actions. These can be both sequential or concurrent. Usually a plan is referred to in the context of the intention to act of some agent, however when executed the plan itself comes into effect."
    Reaction: "A reaction is an action that is (at least) performed by an agent that has observed some other action (this is an intensional view): Action &lt;-&gt; Reaction"
    Trade: "A trade is an exchange of some things between two agents a and b. Consists of two actions A and B where a is the actor of action A and the recipient of action B, and vice versa. Usually these actions are performed concurrently, but these may also be done consequently. The ownership of the things being traded is the requirement/result pair for each action."
    Transaction: "A transaction is an exchange or interaction between at least two agents a and b. Consists of two actions A and B where a is the actor of action A and the recipient of action B, and vice versa. Usually these actions are performed concurrently, but these may also be done consequently."
    actor: "Specifies that some participant is an actor in the action."
    actor_in: "Specifies that the participant is an actor in some action."

    LegalRole: "A legal role is a role played in a legal context. Legal role players can be both Agents and other 'things'"
    SocialLegalRole: "A social legal role is played by some agent in the context of legal activities."
    ProfessionalLegalRole: "A professional legal role is a legal profession of some person, examples: lawyer, judge etc."

    OrganisationRole: "A role which has a meaning in the context of an organisation: i.e. the role defines a &#39;position&#39; within sthe structure of roles within an organisation"