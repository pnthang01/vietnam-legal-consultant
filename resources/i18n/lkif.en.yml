en:
  comment:
    #norm.owl
    HohfeldianPower: "A hohfeldian power covers any action which determines a legal effect."
    NormativelyQualified: "Some thing which is qualified (allowed, disallowed) by a norm, i.e. a norm applies to the thing. Taking the principle of deontic choice to mean that the utterer of a normative statement intends to influence choices made by the addressee of the statement, the qualified thing should is comparable to some alternative. Note that Qualified does not partition into Allowed and Disallowed. Firstly, things can be Allowed by one Norm and Disallowed by another one. Secondly, the logical complement of the thing allowed by a permission is qualified (as worse or equal than the thing allowed), but neither allowed nor disallowed."
    CodeOfConduct: "a code outlining the responsibilities of or best practice for an individual or organisation, such as a set of principles of good corporate behaviour adopted by a business."
    Regulation: "A regulation bears one or more norms, all of which are uttered by some legislative body. It cannot bear expressions which are not uttered by a legislative body."
    SoftLaw: "The term \"soft law\" refers to quasi-legal instruments which do not have any binding force, or whose binding force is somewhat \"weaker\" than the binding force of traditional law, often referred to as \"hard law\", in this context. The term \"soft law\" initially appeared in the area of international law, but more recently it has been transferred to other branches of law."
    StrictlyDisallowed: "Loose end."
    PermissiveRight: "The  negation of a directed obligation is a directed permission. However, it counts as a right,  namely, a permissive right, only when such negation is aimed at benefitting the author of  the permitted action."
    Proclamation: "A proclamation (Lat. proclamare, to make public by announcement) is an official declaration."
    LegalExpression: "Legal expressions are created by  some legal speech act and qualified by a communicated attitude"
    QualificatoryExpression: "Ascribes a legal role to a person or an object (for example,  “x is a citizen”, “x is an intellectual work”, “x is a technical invention”);"
    EnablingPower: "An enabling power is used in cases where the law aims at enabling some agent to produce an effect in a particular way."
    ExistentialExpression: "Establishes or terminates the existence of a legal entity (for example “the company ceases to exist”);"
    PersuasivePrecedent: "In law, a persuasive precedent or advisory precedent is a precedent that need not be followed under the legal principle of stare decisis, but is nevertheless followed. Sources of persuasive precedent include the obiter dicta in the judgment of a court whose judgment would otherwise be binding, and the judgments of courts in other jurisdictions where the facts and/or legal system are similar to the case at hand. If a superior court adopts a persuasive precedent, it may become binding in the jurisdiction."
    BeliefInViolation: "A belief in some violation"
    Decree: "The word decree is often used as a derogative term for any authoritarian decision"
    StrictlyAllowed: "Loose end."
    LegalDoctrine: "Legal doctrine is a framework, set of rules, procedural steps, or test, often established through precedent in the common law, through which judgments can be determined in a given legal cas"
    Resolution: "A resolution is a written motion adopted by a deliberative body. The substance of the resolution can be anything that can normally be proposed as a motion."
    EvaluativeExpression: "A legal evaluative expression asserts that something is good or bad, is a value to be optimised or an evil to be minimised (for example “human dignity is value”, “participation ought to be promoted”);"
    LibertyRight: "When, for the benefit of a person, this person is both permitted to perform and to omit an action – that is, when the action is facultative – we can say that he or she has a liberty right with regard to that action."
    DeclarativePower: "A declarative power covers the case when an effect is produced through the party’s declaration of it\nWe say that j has the declarative power to realize A to mean that if j declares A, then it is legally valid that A. For example, if x has the declarative power to terminate y’s obligation toward x to do then if x declares that y’s obligation toward x finishes, then it is legally valid that this obligation finishes."
    Contract: "A contract bears one or more norms, all of which are uttered by some natural person or legal person. It cannot bear expressions which are uttered by a different kind of agent."
    Custom: "The collective memory of some group of agents, i.e. propositions beared by custom are shared (i.e. held) by all members of the group"
    ExclusionaryRight: "An exclusionary right concerns the prohibition against performing certain inferences (against reasoning in certain ways), or against using certain kinds of premises for certain purposes, in the interest of a particular person. This is especially the case with anti-discrimination rules."
    InternationalAgreement: "An agreement entered into by actors in international law, namely states and international organizations."
    CustomaryLaw: "In law, custom, or customary law consists of established patterns of behaviour that can be objectively verified within a particular social setting."
    ActionPower: "An action-power consists in a generic power to produce a legal effect through an action determining it. Also called Subjections"
    LegalSource: "A legal source is a source for legal statements, both norms and legal expressions. In a sense it is literally a 'source' of law"
    Statute: "A statute bears one or more norms, all of which are uttered by some legal person. It cannot bear expressions which are uttered by a different kind of agent."
    InternationalArbitration: "International Arbitration is the established method today for resolving disputes between parties to international commercial agreements. As with arbitration generally, it is a creature of contract, i.e., the parties' decision to submit any disputes to private adjudication by one or more arbitrators appointed in accordance with rules the parties themselves have agreed to adopt, usually by including a provision for the same in their contract. The practice of international arbitration has developed so as to allow parties from different legal and cultural backgrounds to resolve their disputes, generally without the formalities of their underlying legal systems."
    Immunity: "Also called Disabilities"
    Treaty: "A treaty is a binding agreement under international law entered into by actors in international law, namely states and international organizations. Treaties are called by several names: treaties, international agreements, protocols, covenants, conventions, exchanges of letters, exchanges of notes, etc."
    MandatoryPrecedent: "In law, a binding precedent (also mandatory precedent or binding authority) is a precedent which must be followed by all lower courts. It is usually created by the decision of a higher court, such as the House of Lords in the United Kingdom. Binding precedent relies on the legal principle of stare decisis."
    Code: "A legal code bears one or more norms, all of which are uttered by some legislative body. It cannot bear expressions which are not uttered by a legislative body."
    Allowed: "See normatively qualified. Alternative labels: permitted, sanctioned, let, licensed."
    ObservationOfViolation: "An observation of a violation, i.e. of something that is Disallowed."
    LegalDocument: "A legal document is a document bearing norms or normative statements. By virtue of this definition the norm-as-propositional-attitude is reified as norm-as proposition. In other words, the norm being expressed through the legal source is an expression of the propositional attitude. Subclasses of legal source can be distinguished through the authority of the agent creating the expression (i.e. the agent holding the norm)."
    PotestativeExpression: "Attributes a power to some agent (for example “a worker has the power to terminate his work contract”);"
    Norm: "A norm is a kind of Qualification. A qualification which normatively qualifies some thing (i.e. some normatively qualified): i.e. a qualification which allows or disallows some thing."
    PotestativeRight: "A potestative right is an enabling power which is meant to benefit the holder of the power. For example, if some animal y does not belong to anybody, then x has the potestative-right to start x’s ownership of the animal,  by capturing y."
    AllowedAndDisallowed: "Something which is both allowed and disallowed through some norm"
    Obligation: "See prohibition"
    DisallowedIntention: "The propositional content (i.e. that which is intended) of the intention is disallowed. Interesting concept for establishing mens rea (guilty mind), although 'disallowed' is a weaker qualification than criminal. Note the distinction between purposely committing a crime and knowingly committing a crime. The crime committed does not have to match the crime intended for establishing intent!"
    Permission: "Permission allows propositions, to which therefore the predication Allowed applies. The thing(s) allowed is/are a subset of the thing(s) qualified by the permission. If S then P(A) means that S is qualified and S and A is allowed."
    LiabilityRight: "A liability right expresses some right to act that brings with it some liability to perform another (compensating) act. For instance, if some k performs the permitted action A, then k will have to perform another action B for the benefit of j."
    Right: "A right is the legal or moral entitlement to do or refrain from doing something or to obtain or refrain from obtaining an action, thing or recogition in civil society."
    Obliged: "Is allowed by an Obligation, i.e. the alternative is strictly_worse according to the Obligation. Alternative labels: directed, commanded."
    NonBindingInternationalAgreement: "Some international agreement that is not binding under international law"
    Directive: "Examples are European Union directive, a legislative act of the European Union and Directives, used by United States Government agencies (particularly the Department of Defense) to convey policies, responsibilities, and procedures."
    Disallowed: "See Qualified. Alternative labels: violation, prohibited, forbidden"
    DefinitionalExpression: "A definition in a legal context (for example “x means y” or “by x it is meant y”);"
    Prohibition: "Prohibition obliges/allows thing(s), to which therefore the predication Obliged applies, and disallows thing(s), to which therefore the predication Disallowed applies. The union of the thing(s) allowed and the thing(s) disallowed is qualified by the prohibition. The things allowed and disallowed by the prohibition are disjoint (and completely partition the space of things qualified). If S then O(A) means that S is qualified, S and A is obliged/allowed, and S and not A is disallowed. If S then F(A) means that S is qualified, S and A is disallowed, and S and not A is obliged/allowed. The difference between Obligation and Prohibition is in which part of the partition of the qualified space is explicitly described by the normative statement. Alternative label: directive"
    Precedent: "In law, a precedent or authority is a legal case establishing a principle or rule that a court may need to adopt when deciding subsequent cases with similar issues or facts. The term may also refer to the collective body of case law that a court should consider when interpreting the law. When a precedent establishes an important legal principle, or represents new or changed law on a particular issue, that precedent is often known as a landmark decision."
    ObligativeRight: "Directed obligative ought-to-do are also called obligative rights. k has the obligative  right that j does A iff it is obligatory, toward k, that j does A. An example of obligative  right is “it is obligatory, toward Mary, that Tom pays 1,000 euro to John”"
    #lkif-core-top.owl
    AbstractEntity: "An abstract concept is a concept which does not (necessarily) have a referent in either the physical or the mental world. Abstract entities are (proto)mathematical, formal entities, entities which have a purely formal, logical or mathematical meaning. As all concepts are abstractions, one may argue that a separate abstract world is difficult to see. In common-sense, a circle has more properties and is less abstract than in mathematics. Even mathematicians marvel about the fact their pure abstractions enable us to predict very concrete things. However, we are not directly concerned with these mappings. The most important is that common-sense knows about a (small) number of proto-mathematical concepts, such as collections, sequences and count-numbers (positive integers). We know also about geometric simplifications such as line, circle, square, cube, etc. These common sense notions might even be the real roots of our mathematics. However, these kind of semi-formal abstractions do not play a very central role in law, and therefore LRI-Core is thinly populated with abstract classes."
    MentalEntity: "We made the assumption that our views of the mental world have been developed in analogy with physical processes. Mental objects like thoughts are made of elementary parts: concepts. The contents (substance) of these objects are representations. The conceptual content of thoughts are intended by propositional attitudes, like belief, desire, norm etc. Mental objects are processed or stored in containers like a mind which has parts like various memories. Mental processes like thinking, memorizing, imaging, etc. are operations on mental objects. The energy equivalent of mental processing are emotions: the forces that make us focus our mental energies. There is an important difference between the mental world and the physical. Where physical processes occur causally, mental processes are controlled by an intentional stance. The outcome of mental processes can be the intention to act. The intention to act may consist of a structure of primary actions: a plan. The actions can be aimed at bringing about physical changes, but they may also be aimed at changing the mental state of another agent: these intended actions are communication actions. Like direct actions, communication actions have a physical appearance. They also need some physical medium to transfer the intended mental state. Speech act is the common term for these actions. Whether this notion of intended control over mental processes and actions is an illusion or not is besides the point in modeling common-sense. The intentional stance implies a kind of backward, teleological reasoning over causally related processes. A mental object like a  plan consists of a goal state (intention) and is produced by reasoning from goal to means (actions): this is what rational agency behavior is about.  The mental world is not only a reflective one based in our minds eye. We may observe the stream of conscious mental processes, but the role of the mental conceptualizations is of even more important in understanding and communicating with other people. Mental processes and attitudes (sources of intention) are in the first place the building stones for modeling the minds of other people. The intentional stance means in the first place that we attribute to others and to some extent also to many animals intentions and intention directed mental processing and belief."
    MentalObject: "Metaphor of physical concepts, i.e. the things we mentally manipulate, either in thought or memory"
    Occurrence: "The physical world evolves around two main classes: physical objects and processes. In lkif-core-core, the physical world evolves around two main classes: physical objects and processes. Objects are pieces of matter, while matter is typed by substances. Objects have mass, extension, viz. form and aggregation state (which limits form). Objects are the specification of the notion that matter, and in particular solid objects, is what makes the physical world relatively stable and observable. We define (physical) situations in the first place by the arrangement of physical objects (entities)."
    PhysicalEntity: "The physical world evolves around two main classes: physical objects and processes. In lkif-core-core, the physical world evolves around two main classes: physical objects and processes. Objects are pieces of matter, while matter is typed by substances. Objects have mass, extension, viz. form and aggregation state (which limits form). Objects are the specification of the notion that matter, and in particular solid objects, is what makes the physical world relatively stable and observable. We define (physical) situations in the first place by the arrangement of physical objects (entities)."
    SpatioTemporalOccurrence: "An occurrence in space-time."
    #mereology.owl
    Atom: "An atom has no parts"
    Composition: "A composition has multiple parts, the components should meet"
    Pair: "A composition of exactly two parts"
    Part: "A part is a part_of some whole"
    Whole: "A whole has at least some part"
    component: "Specifies that some thing is a (functional) component of some other thing"
    component_of: "Specifies that some thing is a (functional) component of some other thing"
    composes: "Specifies that some thing is composed_of (spatially) within some other thing"
    composed_of: "Specifies that some thing is composed_of (spatially) within some other thing"
    contains: "Specifies that some thing is contained (spatially) within some other thing"
    contained_in: "Specifies that some thing is contained (spatially) within some other thing"
    direct_part_of: "The non-transitive part_of relation"
    direct_part: "The non-transitive part relation"
    member_of: "Specifies membership of a set or group"
    member: "Specifies membership of a set or group"
    part: "Transitive part relation"
    part_of: "Transitive part_of relation"
    strict_part_of: "Non transitive part_of relation"
    strict_part: "Non transitive part relation"
    #time.owl
    Interval: "An interval is a composition of multiple periods of time."
    Moment: "A moment is an atomic period of time, i.e. it cannot be divided into other parts"
    PairOfPeriods: "A pair of two time periods"
    TemporalOccurrence: "A period of time, has a duration"
    after: "Specifies that a time period occurs after another period, but might overlap with it."
    before: "Specifies that a time period occurs before another period, but might overlap with it."
    between: "Specifies that a time period occurs between two other periods"
    during: "Specifies that a time period occurs during another period"
    finishes: "Specifies that a time period finishes another period, i.e. the other period starts before, but ends at the same moment"
    immediately_after: "Specifies that a time period occurs immediately after another period, i.e. it starts where the other period ends"
    immediately_before: "Specifies that a time period occurs immediately before another period, i.e. it ends where the other period starts. t1 previous t2: interval t1 is before t2, but there is no interval between them, i.e., t1 ends where t2 starts"
    overlap: "Specifies that a time period overlaps with another time period (in any way)"
    preceeds: "Specifies that a time period preceeds another period, the periods do not overlap"
    starts: "Specifies that a time period starts another period, i.e. the other period starts at the same time, but ends at a later time."
    temporal_relation: "A relation between two time periods"
    #process.owl
    Change: "A change is a difference between the situation before and after the change occurs (the event of the change). A change can be instantaneous"
    Continuation: "The continuation of a change, once initiated"
    Initiation: "The initation of a change"
    MentalProcess: "A mental, i.e. non-physical, process that has no physical effects. Examples are (human) thought and reasoning."
    PhysicalObject: "A physical object is a physical entity consisting of matter, it has a spatio-temporal extension."
    Process: "A process is a &#39;causal&#39; change: any change which can be explained through some known or understood causal structure. Every process has some Time_Period as duration."
    Termination: "The termination of a change."
    created_by: "Specifies that some thing is created (i.e. a result of) by a process, and exists because of the process taking place."
    creation: "Specifies that some thing is created (i.e. a result of) by a process, and exists because of the process taking place."
    participant: "A participant is someone or something that participates in a change, i.e. is involved in a change"
    participant_in: "Specifies that some thing participates in a process"
    requirement: "A requirement relation relates the process with a prerequisite for that process: without it the process cannot occur"
    requirement_of: "Specifies that some participant is a requirement for a process"
    resource: "A resource is some quantity of something used to perform the action: i.e. time, energy"
    resource_for: "Specifies that some participant is a resource for a process"
    result: "Specifies that some participant is the result of the process, it might have existed before the process took place, but is in some way altered"
    result_of: "Specifies that some participant is the result of a process, it might have existed before the process took place, but is in some way altered (an &#39;inanimate&#39; goal of an act)"
    #action.owl
    Action: "An action is a change which is brought about by a single agent, playing a role. The agent is the holder of some indended outcome of the action: an action is always intentional. The intention of the agent has usually corresponds with an expectation the intended outcome to be brought about: the agent believes in some expectation. Note that the intention might not correspond with the *actual* outcome of the action."
    Agent: "An agent is any owl:Thing which can act, i.e. play the &#39;actor&#39; role wrt. an action. It is a holder for propositional attitudes"
    Artifact: "A physical object created by some person to fulfill a particular purpose"
    CollaborativePlan: "A collaborative plan is a plan which is shared (and executed) between at least two agents a and b. "
    Creation: "An act which results in the creation of some entity/individual"
    NaturalObject: "A natural object is an object not created by man."
    Organisation: "An organisation is a group of other organisations or persons which acts &#39;as one&#39;. An organisation can be both formal (i.e. created by law or decree) or informal."
    Person: "A person is an individual agent. Usually associated with &#39;human being&#39;."
    PersonalPlan: "A personal plan is a plan which is held (and can be executed) by at most one agent."
    Plan: "A plan is a structure of multiple other plans or actions. These can be both sequential or concurrent. Usually a plan is referred to in the context of the intention to act of some agent, however when executed the plan itself comes into effect."
    Reaction: "A reaction is an action that is (at least) performed by an agent that has observed some other action (this is an intensional view): Action &lt;-&gt; Reaction"
    Trade: "A trade is an exchange of some things between two agents a and b. Consists of two actions A and B where a is the actor of action A and the recipient of action B, and vice versa. Usually these actions are performed concurrently, but these may also be done consequently. The ownership of the things being traded is the requirement/result pair for each action."
    Transaction: "A transaction is an exchange or interaction between at least two agents a and b. Consists of two actions A and B where a is the actor of action A and the recipient of action B, and vice versa. Usually these actions are performed concurrently, but these may also be done consequently."
    actor: "Specifies that some participant is an actor in the action."
    actor_in: "Specifies that the participant is an actor in some action."
    #role.owl
    SocialRole: "A social role is played by some agent in the context of social activities. The social role brings with it some expectation of &#39;default&#39; behavior of the role-filler. played_by all (action:Agent and (action:actor_in some (action:Action and (plays some expression:Expectation)))) "
    PersonRole: "A role played by some person (i.e. not an organisation)"
    OrganisationRole: "A role which has a meaning in the context of an organisation: i.e. the role defines a &#39;position&#39; within sthe structure of roles within an organisation"
    Role: "A role is a specification of default behavior and accompanying expectations of the thing &#39;playing&#39; the role. Similar to actors in a theater who play roles, but are not the roles. Example: student."
    SubjectiveEntity: "A subjective entity is ontologically subjective, i.e. its existence is relative to an observer, that attributes its properties to some other entity, given a context."
    Function: "The use or purpose of some object as used in some context."
    EpistemicRole: "The role of something used in a (mental) reasoning/inference process"
    plays: "Specifies that some thing plays a role"
    played_by: "Specifies that some role is played by some thing"
    imposed_on: "Specifies that some subjective entity is imposed on some thing"
    counts_as: "The counts-as relation of Searle (1995) is used to express the creation of observer-relative or social facts such as the playing of roles or having a function."
    context: "The context property relates a subjective entity to the context in which the entity holds."
    #expression.owl
    Argument: "An argument is a reason that is expressed through some medium"
    Assertion: "The assertion is subject to a fit between words and world, in Searle&#39;s terms. It&#39;s propositional content can be true of false. If it is inconsistent with other assertions, beliefs, observations, it may come to be considered false."
    Assumption: "proposes something that usually is the case, although there is no specific evidence that it is true in this particular case"
    Belief: "Someting an agent believes in, i.e. holds as true"
    Cause: "A cause is an epistemic role played by something which is the outcome of a (chain) of processes"
    CommunicatedAttitude: "A communictated attitude is a propositional attitude involved in an act of communication."
    Declaration: "Searle: the successful performance of a declaration is sufficient to bring about the fit between words and world, to make the propositional content true. In other words, if there is an inconsistency between the declaration and assertions, beliefs, or observations, it is not the declaration that is false. True of definitions and norms, and several other performative statements by legislators."
    Desire: "A feeling of wanting"
    Expectation: "An expectation is a predictive belief held on purely logical grounds, i.e. not based on direct external evidence, like an observation or a statement by another agent. It is also often characterized as a &quot;belief about the future&quot;, but this isn&#39;t very helpful since one may also hold expectations about the (yet unknown) past. The theory of evolution is for instance a fertile ground for predictions about the existence of past species, and therefore at the same a predictor of future observations. Is not only not an observation by itself, but also the thing being expected cannot be an observation in any sense."
    Expression: "An expression is a proposition beared by some medium, e.g. a document, and is stated by some communicated attitude"
    Document: "A Document bears some (and only) expression(s) stated by some statement in writing."
    EvaluativeAttitude: "An evaluative attitude expresses e.g. a judgment. The proposition qualified by the evaluative attitude is comparable to something else."
    EvaluativeProposition: "Some thing which is evaluatively qualified, i.e. an evaluation applies to the proposition, the proposition is judged. The proposition is comparable to some other proposition."
    Evidence: "Observation and/or statement, used as a backing for a belief. Evidence is the role of observation which is qualified by some belief."
    Exception: "An exception is something that is excluded from a general statement or does not follow a rule. In LKIF rules, an exception is a rule which has an exception relation to another rule (cf. Deliverable 1.1)"
    Fact: "A fact is a proposition (about something) which is (commonly) agreed upon to hold as true: it has some backing in evidence"
    Intention: "Intention is where the agent expects certain consequences of his or her actions and desires those consequences to occur. This concept must be related to qualification and preference in some way."
    Lie: "An assertion that is inconsistent with the beliefs of the speaker. It is *intentionally* false."
    Medium: "A medium is a bearer of expressions, i.e. externalised propositions. Propositions become expressions once they are externalised through some medium."
    Observation: "An observation is the role played by some proposition believed to be true or false through observation of an agent."
    Problem: "A problem is an observation that deviates from an Intention."
    Promise: "A promise is a communicated attitude about some future action or state"
    Proposition: "A (non logical) proposition is a proposition qualified by a propositional attitude. NB: The proposition used here does not correspond to a proposition in proposition logics."
    PropositionalAttitude: "A propositional attitude connects a person (the holder of the attitude) to some proposition, in fact it expresses some qualification over the proposition. Distinguishing a proposition from the propositional content expressed by it is necessary when properties relating to the thing expressed and properties of the expression itself must be distinguished. For LKIF the distinction between Belief, Intention, Qualification, and Observation is relevant. The distinction between belief/expectation, intention, and observation is relevant for i.a. establishing mens rea (guilty mind). The distinction between beliefs (expressing the content of the mind of an agent) and statements (expressing the content of an act of communication by an agent) is classical."
    Qualification: "A qualification expresses e.g. a judgment. The thing qualified by the qualification is comparable to something else."
    Qualified: "Something that is qualified by some qualification"
    Reason: "Teleological counterpart of cause"
    SpeechAct: "A speech act (or illocutionary act) creates some propositional attitude which qualifies an expression (which by default is mediated through some medium). The actor of the speech act is the utterer of the atitude (NB cannot be expressed in OWL DL)."
    StatementInWriting: "Not to be confused with the actual writing/document itself, which is the medium of the statement."
    Surprise: "A surprise is an observation that deviates from an expectation."
    addressee: "Allows for expressing the relation between a communicated attitude and the Agent to which the communication act is addressed"
    asserted_by: "Relates an expression being asserted to the assertion"
    asserts: "Relates an assertion to the expression being asserted"
    attitude: "Relates a proposition to the attitude held towards it"
    author: "Relates an expression to the author of the expression (e.g. for expressions contained in documents)"
    bears: "A Medium &#39;bears&#39; or carries expressions."
    believed_by: "Relates a belief to the agent holding the belief"
    believes: "Relates an agent to the belief(s) it holds"
    declared_by: "Relates a declared expression to the attitude to the declaration"
    declares: "Relates a declaration to the expression being declared"
    evaluated_by: ""
    evaluatively_comparable: "Expresses whether some thing is evaluatively comparable to some other thing."
    held_by: "Relates a propositional attitude to the agent holding the attitude"
    holds: "Relates an agent to the propositional attitude it holds"
    intended_by: "Specifies that some intention is held by some agent"
    intends: "Specifies that the agent holds some intention"
    medium: "Relates an expression to the medium it is beared in (i.e. for extentional propositions)"
    observer: "Relates a believed observation to the agent observing it"
    observes: "Relates an agent to the thing it beliefs it observes"
    promised_by: "Relates an expression to the promise over the expression"
    promises: "Relates a promise to the expression being promised"
    qualified_by: "Relates something which is qualified to the attitude or qualification qualifying it"
    qualifies: "Relates an evaluative attitude or qualification to the proposition or thing being qualified"
    stated_by: "Relates a statement to its author"
    states: "Relates an author to its statements"
    towards: "A towards relation between a propositional attitude and a proposition expresses that the attitude is held towards that proposition. Qualification of the proposition can be either true or false, i.e. the attitude denotes whether the proposition is either true or false."
    utterer: "Relates an utterance (communicated propositional attitude) to its utterer"
    utters: "Relates an agent to its utterance(s)"

    LegalRole: "A legal role is a role played in a legal context. Legal role players can be both Agents and other 'things'"
    SocialLegalRole: "A social legal role is played by some agent in the context of legal activities."
    ProfessionalLegalRole: "A professional legal role is a legal profession of some person, examples: lawyer, judge etc."
